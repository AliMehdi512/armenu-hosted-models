<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body, html { height:100%; width:100%; margin:0; background: transparent; overflow:hidden; user-select:none; }
      model-viewer { width:100%; height:100%; background: transparent; }
      model-viewer::part(container) { background: transparent; }
      #model-container {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 280px;
        height: 280px;
        margin-left: -140px;
        margin-top: -140px;
        transition: all 0.08s ease-out;
        touch-action: none;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div id="model-container">
      <model-viewer id="mv" camera-controls auto-rotate exposure="1" shadow-intensity="1" loading="eager" reveal="auto" style="width:100%;height:100%;"></model-viewer>
    </div>

    <script>
      function getQuery(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const model = getQuery('model');
      const mv = document.getElementById('mv');
      if (model) {
        mv.setAttribute('src', model);
      } else {
        mv.innerText = 'No model specified';
      }

      const container = document.getElementById('model-container');
      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      let currentX = window.innerWidth / 2;
      let currentY = window.innerHeight / 2;
      let scale = 1;
      let initialDistance = 0;

      // Smooth animation loop - moves model toward QR position rapidly
      setInterval(() => {
        currentX += (targetX - currentX) * 0.15;
        currentY += (targetY - currentY) * 0.15;
        updateContainerPosition();
      }, 16);

      function updateContainerPosition() {
        const w = container.offsetWidth / 2;
        const h = container.offsetHeight / 2;
        container.style.left = (currentX - w * scale) + 'px';
        container.style.top = (currentY - h * scale) + 'px';
        container.style.transform = `scale(${scale})`;
      }

      // Receive QR position from app and move model toward it
      window.onQrFound = function(nx, ny) {
        try {
          const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
          targetX = nx * vw;
          targetY = ny * vh;
        } catch (e) { }
      };

      // Pinch to zoom - expand model to up to 3x scale
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialDistance = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialDistance > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const ratio = distance / initialDistance;
          scale = Math.max(1, Math.min(ratio, 3));
          updateContainerPosition();
        }
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialDistance = 0;
        }
      }, { passive: true });
    </script>
  </body>
</html>
