<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body, html { height:100%; margin:0; background:#000; }
      model-viewer { width:100%; height:100%; }
    </style>
  </head>
  <body>
    <model-viewer id="mv" camera-controls auto-rotate exposure="1" shadow-intensity="1">
    </model-viewer>

    <script>
      function getQuery(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const model = getQuery('model');
      const mv = document.getElementById('mv');
      if (model) {
        mv.setAttribute('src', model);
      } else {
        mv.innerText = 'No model specified';
      }
    </script>
  </body>
</html>
